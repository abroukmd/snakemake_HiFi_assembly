name: genomescope2_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - git
  - make
  - wget
  - gcc
  - kmc
  - r-base
  - r-minpack.lm
  - r-argparse
  # Required GenomeScope import; install it through Conda, without CRAN Suggests.
  - r-jsonlite=2.0.0
  - r-optparse
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-devtools
  - r-remotes
  - pip
